<div class="publications filter-highlight" id="projects">
  <div class="publications-header">
    <h2>Selected Projects</h2>
    <div class="publications-filter" role="group" aria-label="Filter projects">
      <button type="button" class="filter-btn" data-filter="all">All</button>
      <button type="button" class="filter-btn active" data-filter="highlight">Highlight</button>
    </div>
  </div>
  {% bibliography -f papers -q @*[selected=true]* %}
</div>

<script>
  (function () {
    var root = document.getElementById('projects');
    if (!root) return;

    var buttons = root.querySelectorAll('.filter-btn');
    var items = root.querySelectorAll('ol.bibliography > li');

    function applyFilter(mode) {
      root.classList.toggle('filter-highlight', mode === 'highlight');
      root.classList.toggle('filter-all', mode === 'all');
      items.forEach(function (li) {
        var isHighlight = !!li.querySelector('.highlight-paper');
        var show = mode === 'all' || isHighlight;
        li.classList.toggle('is-hidden', !show);
      });
      buttons.forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-filter') === mode);
      });
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyFilter(btn.getAttribute('data-filter'));
      });
    });

    applyFilter('highlight');
  })();
</script>
